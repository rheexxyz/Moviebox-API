services:
  moviebox-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviebox-api
    labels:
      org.opencontainers.image.title: "MovieBox API Pro"
      org.opencontainers.image.authors: "Faisal (https://github.com/faisaljs)"
      org.opencontainers.image.source: "https://github.com/faisaljs/Moviebox-API"
      org.opencontainers.image.licenses: "MIT"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    environment:
      CATALOG_DB: /data/catalog.db
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
